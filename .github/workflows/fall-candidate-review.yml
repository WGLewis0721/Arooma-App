name: Autumn Archive artwork candidate review
on:
  push:
    branches:
      - plan/fall-2026-30-card-collection
    paths:
      - assets/collectibles/seasons/fall-2026/candidates.json
      - scripts/stage_fall_candidates.py
      - .github/workflows/fall-candidate-review.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install 'Pillow>=10,<13'
      - name: Download and inspect candidate image dimensions
        run: python scripts/stage_fall_candidates.py
      - name: Upload private QA artifact (not released into app)
        uses: actions/upload-artifact@v4
        with:
          name: arooma-fall-2026-30-artwork-candidates
          path: _build/fall-candidates/
          if-no-files-found: error
          retention-days: 14

      - name: Store generated proof assets in the feature branch (not commercially approved)
        env:
          ART_BRANCH: plan/fall-2026-30-card-collection
        run: |
          set -euo pipefail
          out="assets/collectibles/seasons/fall-2026/proofs"
          mkdir -p "$out"
          find _build/fall-candidates -maxdepth 1 -name '*.jpg' -exec cp '{}' "$out/" ';'
          test "$(find "$out" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 31
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if ! git diff --cached --quiet; then
            git commit -m "assets: store 30 generated fall proof images (not release-approved)"
            git push origin "HEAD:$ART_BRANCH"
          fi
