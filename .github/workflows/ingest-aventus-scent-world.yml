name: Ingest Aventus animated Scent World
on:
  push:
    branches:
      - feature/animated-scent-world-aventus-20261101
    paths:
      - .github/workflows/ingest-aventus-scent-world.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified Scent World media
        shell: bash
        env:
          SOURCE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IkKBBXHZvEZQt2d8pBaRYd083T/c8178739-0924-4668-a8d2-52449cfc34b0.mp4
          EXPECTED_SHA256: 2ecbb30aa08006e73d0988d33f63abb888274e142f851a55e0a5cd10c98ab1e1
        run: |
          set -euo pipefail
          mkdir -p ios/AroomaNative/Resources
          curl --fail --location --retry 4 --connect-timeout 20 "$SOURCE_URL" -o ios/AroomaNative/Resources/creed-aventus-live-card.mp4
          echo "$EXPECTED_SHA256  ios/AroomaNative/Resources/creed-aventus-live-card.mp4" | sha256sum --check --status
          curl --fail --location --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IkKBBXHZvEZQt2d8pBaRYd083T/977a560b-f681-465c-9f49-f9a66933fc04.jpg' -o ios/AroomaNative/Resources/creed-aventus-live-card-poster.jpg
          echo "c9c368d785d4d31238b018fa0115f7c1e71d44873c254206ccb061feaab724d3  ios/AroomaNative/Resources/creed-aventus-live-card-poster.jpg" | sha256sum --check --status
      - name: Commit the real MP4 and poster to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/AroomaNative/Resources/creed-aventus-live-card.mp4 ios/AroomaNative/Resources/creed-aventus-live-card-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle real Aventus animated Scent World card"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
