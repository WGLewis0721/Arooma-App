name: Maestro iOS
# Manual release check plus a branch-scoped UX audit run; not a release gate.
# Start it from the repo without a Mac: Actions → "Maestro iOS" → Run workflow (choose the branch).
# Results and screenshots are downloaded from the run's Artifacts section.
on:
  push:
    branches:
      - audit/ux-laws-maestro-20261102
    paths:
      - '.maestro/**'
      - '.github/workflows/maestro-ios.yml'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      include_tags:
        description: 'Only run flows with these tags (comma-separated). Leave empty for all flows.'
        required: false
        default: ''
      exclude_tags:
        description: 'Skip flows with these tags (comma-separated). Optional.'
        required: false
        default: ''
jobs:
  maestro:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Check flow syntax (no device needed)
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          for f in .maestro/*.yaml; do maestro check-syntax "$f"; done

      - name: Build Debug simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/AroomaNative.xcodeproj -scheme AroomaNative -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AroomaBuild" CODE_SIGNING_ALLOWED=NO build

      - name: Boot iOS 26 iPhone simulator and install the app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          d = json.load(sys.stdin)["devices"]
          ids = [v["udid"] for k, vs in d.items() for v in vs if "iPhone" in v["name"] and "26" in k]
          print(ids[0] if ids else "")')
          test -n "$DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          perl -e 'alarm 720; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"

      - name: Run Maestro flows
        run: |
          # The iOS driver can take well over the default 120 s to come up on a freshly booted runner simulator
          # ("iOS driver not ready in time"); give it five minutes instead of failing the whole run.
          export PATH="$HOME/.maestro/bin:$PATH" MAESTRO_CLI_NO_ANALYTICS=1 MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
          ARGS=(--udid "$DEVICE" --format JUNIT --output "$RUNNER_TEMP/maestro-results/junit.xml" --test-output-dir "$RUNNER_TEMP/maestro-results/run")
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS+=(--include-tags ux-audit)
          elif [ -n "${{ inputs.include_tags }}" ]; then
            ARGS+=(--include-tags "${{ inputs.include_tags }}")
          fi
          if [ -n "${{ inputs.exclude_tags }}" ]; then ARGS+=(--exclude-tags "${{ inputs.exclude_tags }}"); fi
          mkdir -p "$RUNNER_TEMP/maestro-results"
          maestro test "${ARGS[@]}" .maestro/

      - name: Capture view hierarchy of the final screen
        if: always()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH" MAESTRO_CLI_NO_ANALYTICS=1
          mkdir -p "$RUNNER_TEMP/maestro-results"
          maestro --udid "$DEVICE" hierarchy > "$RUNNER_TEMP/maestro-results/final-hierarchy.txt" 2>&1 || true
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/maestro-results/final-screen.png" || true

      - name: Upload Maestro results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-results
          path: ${{ runner.temp }}/maestro-results/
          if-no-files-found: warn
          retention-days: 14
