name: Native iOS 26 SwiftUI Build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch: {}

# A single compile result per branch. Superseded commits don't burn macOS runners.
concurrency:
  group: native-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Compile native iOS simulator app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AroomaNative.xcodeproj \
            -scheme AroomaNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AroomaBuild" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/arooma-build.log"
          test -d "$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"
      - name: Verify 30 live card fronts are bundled in the normal native app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"
          test -f "$app/catalog.json"
          test -d "$app/proofs"
          python3 - "$app" <<'PY'
          import json, pathlib, sys
          bundle = pathlib.Path(sys.argv[1])
          manifest = json.loads((bundle / "catalog.json").read_text())
          cards = manifest["cards"]
          assert len(cards) == 30, f"Expected 30 cards, got {len(cards)}"
          for card in cards:
              asset = bundle / "proofs" / (card["id"] + ".jpg")
              assert asset.is_file() and asset.stat().st_size > 20000, f"Missing artwork {asset}"
          print("All 30 uniquely named live cards and catalog are embedded.")
          PY
      - name: Stage 30 offline proof images for internal-release compiler verification
        if: ${{ hashFiles('assets/collectibles/seasons/fall-2026/proofs/*.jpg') != '' }}
        run: |
          python3 scripts/prepare_fall_testflight.py
          test "$(find ios/AroomaNative/Assets.xcassets -maxdepth 1 -name 'fall2026-*.imageset' | wc -l)" -eq 30
      - name: Compile internal TestFlight proof configuration (unsigned)
        if: ${{ hashFiles('assets/collectibles/seasons/fall-2026/proofs/*.jpg') != '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AroomaNative.xcodeproj \
            -scheme AroomaNative \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AroomaProofBuild" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=AROOMA_INTERNAL_PREVIEW \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/arooma-proof-build.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Arooma-native-compile-log
          path: |
            ${{ runner.temp }}/arooma-build.log
            ${{ runner.temp }}/arooma-proof-build.log
          retention-days: 7
