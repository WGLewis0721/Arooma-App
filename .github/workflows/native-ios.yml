name: Native iOS 26 SwiftUI Build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show installed Xcode
        run: xcodebuild -version
      - name: Compile native iOS Simulator app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/AroomaNative.xcodeproj -scheme AroomaNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/AroomaBuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/arooma-xcodebuild.log"
      - name: Capture actual native iPhone simulator screens
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arooma-screens"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; pairs=[v["udid"] for k,vs in d.items() for v in vs if "iPhone" in v["name"] and "26" in k]; print(pairs[0] if pairs else "")')
          if [ -z "$DEVICE" ]; then echo "No iOS 26 simulator available"; exit 0; fi
          xcrun simctl boot "$DEVICE" || true
          if ! perl -e 'alarm 90; exec @ARGV' xcrun simctl bootstatus "$DEVICE" -b; then
            echo "Simulator boot unavailable; screenshots skipped, native build remains verified."
            exit 0
          fi
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"
          xcrun simctl launch "$DEVICE" com.graymatter.arooma
          sleep 3
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/arooma-screens/01-welcome.png"
          xcrun simctl terminate "$DEVICE" com.graymatter.arooma
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" com.graymatter.arooma data)
          python3 - "$CONTAINER/Documents/arooma-native-v1.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(dict(mode="Demo",theme="Obsidian Gold",appearance="System",
            layout="Cover Flow",selectedDemoID="dior",selectedMineID=None,selectedShelf="Autumn",
            rotationID=None,bottles=[],rotations=[],onboarded=True)))
          PY
          xcrun simctl launch "$DEVICE" com.graymatter.arooma
          sleep 4
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/arooma-screens/02-gallery.png"
      - name: Upload actual native simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AroomaAtelier-Simulator-Screens
          path: ${{ runner.temp }}/arooma-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload built simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AroomaNative-Simulator
          path: ${{ runner.temp }}/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app
          retention-days: 7
