name: Native iOS 26 SwiftUI Build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch: {}

# A single compile result per branch. Superseded commits don't burn macOS runners.
concurrency:
  group: native-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode
        run: xcodebuild -version
      - name: Wrist-flick detector tests and A/B replay report (pure Swift, no XCTest)
        run: |
          set -o pipefail
          swiftc -O ios/AroomaNative/GyroFlipDetector.swift ios/AroomaNative/GyroPulseDetector.swift \
            ios/AroomaNative/GyroTrace.swift ios/Tests/GyroFlip/Corpus.swift ios/Tests/GyroFlip/Report.swift \
            ios/Tests/GyroFlip/main.swift -o "$RUNNER_TEMP/gyro-tests"
          "$RUNNER_TEMP/gyro-tests" | tee "$RUNNER_TEMP/gyro-tests.log"
      - name: Package the 30 fall image sets for private Debug QA
        run: |
          python3 scripts/prepare_fall_testflight.py
          test "$(find ios/AroomaNative/Assets.xcassets -maxdepth 1 -name 'fall2026-*.imageset' | wc -l | tr -d ' ')" -eq 30
      - name: Compile native iOS simulator app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AroomaNative.xcodeproj \
            -scheme AroomaNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AroomaBuild" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/arooma-build.log"
          test -d "$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"
      - name: Verify all 30 live cards are compiled into the private app's Asset Catalog
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/AroomaBuild/Build/Products/Debug-iphonesimulator/Arooma.app"
          test -f "$app/catalog.json"
          test -f "$app/Assets.car"
          # The MP4 and still poster must actually be in the .app bundle.
          # Compilation alone does not prove offline Scent World playback is possible.
          test -s "$app/creed-aventus-live-card.mp4"
          test -s "$app/creed-aventus-live-card-poster.jpg"
          # Generated Imagination front and reverse must be in the installed app.
          test -s "$app/louis-vuitton-imagination-scent-world-front.png"
          test -s "$app/louis-vuitton-imagination-scent-world-reverse.png"
          xcrun --sdk iphonesimulator assetutil --info "$app/Assets.car" > "$RUNNER_TEMP/arooma-assets.json"
          python3 - "$RUNNER_TEMP/arooma-assets.json" <<'PY'
          import json, pathlib, sys
          assets = json.loads(pathlib.Path(sys.argv[1]).read_text())
          names = {item.get("Name") for item in assets if isinstance(item, dict)}
          manifest = json.loads(pathlib.Path("assets/collectibles/seasons/fall-2026/catalog.json").read_text())
          expected = {"fall2026-" + item["id"] for item in manifest["cards"]}
          missing = expected - names
          assert len(expected) == 30 and not missing, f"Uncompiled fall card images: {sorted(missing)}"
          back = {"fallnotes-"+item["id"]+"-"+stage for item in manifest["cards"] for stage in ("top","heart","base")}
          absent = back - names
          assert len(back) == 90 and not absent, f"Uncompiled reverse note photographs: {sorted(absent)}"
          original = json.loads(pathlib.Path("assets/insights/season-compass/atlas-source.json").read_text())
          icons = {"insight-" + slug for slug in original["cells"]}
          missing_icons = icons - names
          assert len(icons) == 20 and not missing_icons, f"Uncompiled Season Compass ingredient illustrations: {sorted(missing_icons)}"
          print("Verified 30 card fronts, 90 reverse photographs and 20 botanical Insights illustrations.")
          PY
      - name: Compile internal TestFlight proof configuration (unsigned)
        if: ${{ hashFiles('assets/collectibles/seasons/fall-2026/proofs/*.jpg') != '' }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/AroomaNative.xcodeproj \
            -scheme AroomaNative \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/AroomaProofBuild" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=AROOMA_INTERNAL_PREVIEW \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/arooma-proof-build.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Arooma-native-compile-log
          path: |
            ${{ runner.temp }}/arooma-build.log
            ${{ runner.temp }}/arooma-proof-build.log
            ${{ runner.temp }}/gyro-tests.log
          retention-days: 7
