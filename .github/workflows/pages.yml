name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html manifest.webmanifest sw.js dist/
          cp -r assets dist/assets
          if [ -d variants ]; then cp -r variants dist/variants; fi
          touch dist/.nojekyll
          # Fresh service worker cache per deploy
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" dist/sw.js
          echo "Site contents:" && find dist -type f | sort

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Design brain checks
        run: |
          npm run docs:check
          npm run test:docs

      - name: Install test tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test (iPhone viewport)
        run: node tests/smoke.cjs dist artifacts

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: artifacts
          if-no-files-found: ignore

      - name: Package site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Arooma is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open it in Safari on an iPhone, tap Share, then Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
