# View & Style stays reachable from Explore, with its sections, after the navigation change.
appId: com.graymatter.arooma
tags:
  - ux-audit
  - appearance
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- assertVisible: "Arrangement"
- assertVisible: "Atmosphere"
- scrollUntilVisible:
    element: "Card lighting"
    direction: DOWN
- tapOn: "Done"
- tapOn: "My Collection"
- tapOn: "Explore"
- assertVisible:
    id: "explore-add-to-collection"
