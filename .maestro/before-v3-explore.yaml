# BEFORE capture for Arooma V3 (taken on the V2 app). Not a regression gate: it only saves screenshots.
appId: com.graymatter.arooma
tags:
  - capture-before
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- assertVisible:
    id: "explore-add-to-collection"
- takeScreenshot: before-01-explore
- tapOn:
    id: "view-and-style"
- assertVisible: "Arrangement"
- scrollUntilVisible:
    element: "Card lighting"
    direction: DOWN
- takeScreenshot: before-02-view-and-style-card-lighting
- tapOn: "Done"
- tapOn:
    id: "search"
- tapOn: "Name, house.*"
- inputText: "Sauvage"
- takeScreenshot: before-03-explore-search-sheet
