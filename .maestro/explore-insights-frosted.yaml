# Swipe up on the focused card opens the Insights tray; the deck stays selectable and Close collapses it.
appId: com.graymatter.arooma
tags:
  - explore
  - insights
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- swipe:
    start: "50%, 55%"
    end: "50%, 28%"
    duration: 600
- assertVisible: "Close Insights"
- assertVisible: "Compare fragrances"
- takeScreenshot: explore-insights-peek
- tapOn: "Close Insights"
- assertNotVisible: "Compare fragrances"
- assertVisible:
    id: "explore-add-to-collection"
