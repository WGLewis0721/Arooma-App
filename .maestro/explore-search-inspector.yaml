# Search is a function inside Explore. A result opens its Inspector; Close returns to the same search.
appId: com.graymatter.arooma
tags:
  - explore
  - search
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "search"
- tapOn: "Name, house.*"
- inputText: "Sauvage"
- tapOn: ".*Sauvage Elixir.*"
- assertVisible: "FRONT.*TOP NOTES"
- takeScreenshot: explore-search-inspector
- tapOn: "Close"
- assertVisible: "Sauvage"
- tapOn: "Filters"
- assertVisible: "Sort by"
- tapOn: "Done"
- assertVisible: "Sauvage"
- takeScreenshot: explore-search-after-close
