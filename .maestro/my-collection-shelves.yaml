# One action from My Collection opens the editable shelves; rename can be cancelled and Done returns.
appId: com.graymatter.arooma
tags:
  - shelves
  - navigation
---
- launchApp:
    clearState: true
- tapOn: "Start My Collection"
- assertVisible: "Owned"
- tapOn:
    id: "all-shelves"
- assertVisible: "The shelves"
- scrollUntilVisible:
    element: "Rename Autumn"
    direction: DOWN
- tapOn: "Rename Autumn"
- assertVisible: "Rename shelf"
- tapOn: "Cancel"
- tapOn: "Done"
- assertVisible: "Owned"
