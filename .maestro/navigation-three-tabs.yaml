# Exactly three bottom tabs: Explore, Today and My Collection. Explore opens the sample deck first.
appId: com.graymatter.arooma
tags:
  - navigation
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- assertVisible:
    id: "explore-add-to-collection"
- takeScreenshot: nav-01-explore-first-launch
- assertVisible: "Today"
- assertVisible: "My Collection"
- assertNotVisible: "Cards"
- assertNotVisible: "Collection"
- tapOn: "Today"
- assertVisible: "What are you wearing?"
- takeScreenshot: nav-02-today
- tapOn: "My Collection"
- assertVisible: "Owned"
- assertVisible: "Wishlist"
- takeScreenshot: nav-03-my-collection
- tapOn: "Explore"
- assertVisible:
    id: "explore-add-to-collection"
