# Capture a name in Quick Add, then save it to the Wishlist from the review card.
# The save toast closes itself after 4 s and Maestro on iOS needs 5 to 6 s between two taps on this
# animated screen, so tapping Done raced the timer. The QA launch argument (Debug and TestFlight only)
# keeps the toast open until Done.
appId: com.graymatter.arooma
tags:
  - quick-add
---
- launchApp:
    clearState: true
    arguments:
      AroomaQAUndoWindow: 30
- tapOn: "Explore the Archive"
- tapOn: "My Collection"
- tapOn:
    id: "quick-add-a-bottle"
- tapOn: "Fragrance name"
- inputText: "Maestro Test Scent"
- tapOn:
    id: "direct-wishlist"
- assertVisible: "Saved to your Wishlist"
- tapOn:
    id: "direct-done"
