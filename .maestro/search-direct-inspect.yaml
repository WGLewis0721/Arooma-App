# A search result opens its Inspector in one tap; Close returns to Search with the query kept.
appId: com.graymatter.arooma
tags:
  - search
  - navigation
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn: "Search"
- tapOn: "Name, house.*"
- inputText: "Sauvage"
- tapOn: ".*Sauvage Elixir.*"
- assertVisible: "FRONT.*TOP NOTES"
- tapOn: "Close"
- assertVisible: "Sauvage"
