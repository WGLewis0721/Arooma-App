# Search is the third tab. Its query survives opening a result's Inspector and closing it, and its scope
# control (All, Collection, Wishlist, Catalog) responds.
appId: com.graymatter.arooma
tags:
  - v3
  - search
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn: "Search"
- assertVisible:
    id: "arooma-brand-header"
- tapOn: "Name, house.*"
- inputText: "Sauvage"
- assertVisible: ".*Sauvage.*"
- takeScreenshot: v3-search-01-query
- tapOn: "Catalog"
- assertVisible: "2 results"
- tapOn: ".*Sauvage Elixir.*"
- assertVisible: "FRONT.*TOP NOTES"
- takeScreenshot: v3-search-02-inspector
- tapOn: "Close"
- assertVisible: ".*Sauvage.*"
- takeScreenshot: v3-search-03-after-close
