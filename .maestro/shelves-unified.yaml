# One tap from Collection opens the editable shelf surface; rename can be cancelled and Done returns.
appId: com.graymatter.arooma
tags:
  - shelves
  - navigation
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "all-shelves"
- assertVisible: "The shelves"
# The shelf list is a LazyVStack: only Spring and Summer are in the accessibility tree
# until Autumn is scrolled into view.
- scrollUntilVisible:
    element: "Rename Autumn"
    direction: DOWN
- tapOn: "Rename Autumn"
- assertVisible: "Rename shelf"
- tapOn: "Cancel"
- tapOn: "Done"
- assertVisible: "Add to my collection"
