# Smoke: a first-run user enters the archive, opens the one shelf surface and reaches the other tabs.
appId: com.graymatter.arooma
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Explore the Archive"
- tapOn: "Explore the Archive"
- assertVisible: "Add to my collection"
- tapOn:
    id: "all-shelves"
- assertVisible: "The shelves"
- tapOn: "Done"
- tapOn: "Today"
- assertVisible: "What are you wearing?"
- tapOn: "Cards"
- assertVisible: "My Cards"
