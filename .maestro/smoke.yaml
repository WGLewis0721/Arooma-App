# Smoke: the three tabs open their primary screens, and Search, Shelves and Today respond.
appId: com.graymatter.arooma
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- assertVisible:
    id: "explore-add-to-collection"
- tapOn:
    id: "search"
- tapOn: "Name, house.*"
- swipe:
    start: "50%, 20%"
    end: "50%, 92%"
- tapOn: "Today"
- assertVisible: "What are you wearing?"
- tapOn: "My Collection"
- assertVisible: "Owned"
- tapOn:
    id: "all-shelves"
- assertVisible: "The shelves"
- tapOn: "Done"
