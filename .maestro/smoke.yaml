# Smoke: the three tabs open their primary screens, and Search, Shelves and the Wear log respond.
appId: com.graymatter.arooma
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- assertVisible:
    id: "explore-add-to-collection"
- tapOn: "Search"
- tapOn: "Name, house.*"
# The search key puts the keyboard away without scrolling. (Dragging the results also works, but a scroll
# minimizes the tab bar into a small bubble, which has no "My Collection" label to tap.)
- inputText: "Dior"
- pressKey: Enter
- tapOn: "My Collection"
- assertVisible: "Owned"
- tapOn: "Explore"
- tapOn:
    id: "explore-add-to-collection"
- tapOn: "My Collection"
- assertVisible:
    id: "wear-today"
- tapOn:
    id: "all-shelves"
- assertVisible: "The shelves"
- tapOn: "Done"
- tapOn:
    id: "wear-log"
- assertVisible: "What are you wearing?"
- tapOn: "Done"
