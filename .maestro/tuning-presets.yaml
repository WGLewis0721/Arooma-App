# Owner tools: long-press Version opens Tuning in Debug and TestFlight builds only.
# KNOWN FAILING (backlog): after the long press, Maestro's iOS hierarchy does not show the Tuning sheet for
# 18 s or more in the first flow of a simulator session, although the screen and the app's own accessibility
# snapshot hold it. Steps are unchanged. See "tuning-presets" in docs/design/DECISIONS.md.
appId: com.graymatter.arooma
tags:
  - owner-tools
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- scrollUntilVisible:
    element: "Version.*"
    direction: DOWN
- longPressOn: "Version.*"
- assertVisible: "Vivid Holo"
- assertVisible: "Quick adjust"
