# Owner tools: long-press Version opens Tuning in Debug and TestFlight builds only.
# Tuning is a second sheet over View & Style. Right after it opens, Maestro's iOS hierarchy can keep
# describing View & Style, even though the screen already shows Tuning and the app's own accessibility
# snapshot holds both sheets. A screenshot request between the press and the first check makes the
# hierarchy follow the screen (see docs/evidence/2026-11-02-maestro-fixes/README.md).
appId: com.graymatter.arooma
tags:
  - owner-tools
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- scrollUntilVisible:
    element: "Version.*"
    direction: DOWN
- longPressOn: "Version.*"
- takeScreenshot: tuning-opened
- assertVisible: "Vivid Holo"
# "Quick adjust" starts below the fold of the half-height Tuning sheet.
- scrollUntilVisible:
    element: "Quick adjust"
    direction: DOWN
- assertVisible: "Quick adjust"
