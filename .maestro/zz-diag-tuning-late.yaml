# TEMPORARY diagnostic for F2. Not part of the fix; deleted before the final runs.
# Question: does "Vivid Holo" ever appear in Maestro's hierarchy if given 45 s (late), or never (missing)?
appId: com.graymatter.arooma
tags:
  - diag
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- scrollUntilVisible:
    element: "Version.*"
    direction: DOWN
- longPressOn: "Version.*"
- takeScreenshot: diag-late-00-after-press
- extendedWaitUntil:
    visible: "Vivid Holo"
    timeout: 45000
- takeScreenshot: diag-late-01-saw-vivid-holo
