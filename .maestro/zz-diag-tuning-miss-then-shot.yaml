# TEMPORARY diagnostic for F2. Not part of the fix; deleted before the final runs.
# Question: if the first check misses "Vivid Holo", does a screenshot request make it appear?
# Status of the first check in commands.json: COMPLETED = seen without a screenshot, otherwise a miss.
appId: com.graymatter.arooma
tags:
  - diag
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- scrollUntilVisible:
    element: "Version.*"
    direction: DOWN
- longPressOn: "Version.*"
- extendedWaitUntil:
    visible: "Vivid Holo"
    timeout: 4000
    optional: true
- takeScreenshot: diag-mts-00-after-first-check
- extendedWaitUntil:
    visible: "Vivid Holo"
    timeout: 10000
- takeScreenshot: diag-mts-01-saw-vivid-holo
