# TEMPORARY diagnostic for F2. Not part of the fix; deleted before the final runs.
# Repeat sample of the screenshot-then-check order, with a hierarchy dump at the medium detent.
appId: com.graymatter.arooma
tags:
  - diag
---
- launchApp:
    clearState: true
- tapOn: "Explore the Archive"
- tapOn:
    id: "view-and-style"
- scrollUntilVisible:
    element: "Version.*"
    direction: DOWN
- longPressOn: "Version.*"
- takeScreenshot: diag-repeat-00-after-press
- extendedWaitUntil:
    visible: "Vivid Holo"
    timeout: 8000
- runFlow:
    when:
      visible: "Quick adjust"
    commands:
      - takeScreenshot: diag-repeat-01-sees-quick-adjust-at-medium
# Always fails on purpose so Maestro writes the hierarchy and a screenshot for this moment.
- assertVisible: "zz-diag-force-hierarchy-dump"
