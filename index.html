<title>Arooma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --oat:#F2EDE4;--ink:#25231F;--olive:#73765F;--olive-deep:#575A44;--clay:#A4623F;--clay-deep:#8F4E2E;
  --paper:#FBF8F1;--soft:#6B6862;--hair:rgba(37,35,31,.12);
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --cw:216px;--ch:310px;--u:1;--plank:46px;
}
html,body{height:100%;overscroll-behavior:none}
body{background:#DCD4C3;font-family:var(--sans);color:var(--ink);display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

/* ---------- device ---------- */
.device{position:relative;width:390px;height:844px;background:var(--oat);border-radius:54px;overflow:hidden;isolation:isolate;
  box-shadow:0 0 0 9px #1b1a18,0 0 0 10px #4a4741,0 50px 90px -30px rgba(37,35,31,.55);transform:scale(var(--fit,1))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.sb{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 30px 0 38px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sb .r{display:flex;gap:6px;align-items:center}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:110;pointer-events:none}

/* ---------- header ---------- */
.head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 22px 12px}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--olive-deep);font-weight:600;font-variant-numeric:tabular-nums}
h1{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.012em;line-height:1.05;margin-top:4px}
.hbtns{display:flex;gap:8px}

/* ---------- glass (controls and navigation only) ---------- */
.glass{background:rgba(251,248,241,.58);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px -12px rgba(37,35,31,.42),0 0 0 .5px rgba(37,35,31,.08);color:var(--ink)}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--ease)}
.round:active,.pickbtn:active{transform:scale(.94)}

/* ---------- stage (the cabinet interior) ---------- */
.stage{position:relative;flex:1 1 auto;min-height:200px;margin:0 12px;border-radius:24px;
  background:linear-gradient(180deg,#E9E2D4 0%,#EEE8DB 62%,#E6DECE 100%);
  box-shadow:inset 0 0 0 1px rgba(37,35,31,.07),inset 0 16px 28px -20px rgba(37,35,31,.30),0 1px 0 rgba(255,255,255,.7);
  overflow:hidden;perspective:1200px;perspective-origin:50% calc(100% - var(--plank) - var(--ch) / 2 + 14px);touch-action:pan-y;outline:none}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease;
  background:radial-gradient(110% 80% at -10% 35%,rgba(255,252,244,.95),rgba(255,252,244,0) 62%),linear-gradient(90deg,rgba(255,255,255,0),rgba(37,35,31,.05))}
.stage.lit::before{opacity:1}
.plank{position:absolute;left:0;right:0;bottom:0;height:var(--plank);background:linear-gradient(180deg,#F4EFE4 0%,#E4DBC9 100%);border-top:1px solid rgba(255,255,255,.75);box-shadow:0 -14px 20px -14px rgba(37,35,31,.30);pointer-events:none}
.plank::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(180deg,rgba(37,35,31,.10),rgba(37,35,31,0))}
.stage-cap{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--olive-deep);z-index:2;pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .25s}

/* ---------- cards ---------- */
.slot{position:absolute;left:50%;bottom:calc(var(--plank) - 14px);width:var(--cw);height:var(--ch);margin-left:calc(var(--cw) / -2);
  transform-style:preserve-3d;transition:transform .85s var(--ease),opacity .6s var(--ease);will-change:transform;cursor:pointer;outline:none;z-index:10}
.stage.dragging .slot{transition:none}
.stage.dragging{cursor:grabbing}
.slot:focus-visible .front{outline:2px solid var(--olive);outline-offset:3px}
.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--ease)}
.slot.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--u)*10px);border-radius:calc(var(--u)*10px);background:var(--paper);overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 0 0 1px rgba(37,35,31,.08),inset 0 1px 0 rgba(255,255,255,.95),0 24px 26px -24px rgba(37,35,31,.6),0 5px 10px -5px rgba(37,35,31,.2)}
.slot.is-pick .face{box-shadow:0 0 0 1.5px var(--olive),inset 0 1px 0 rgba(255,255,255,.95),0 28px 30px -22px rgba(37,35,31,.65),0 5px 12px -5px rgba(37,35,31,.22)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 40%,rgba(37,35,31,.035) 100%)}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;background:var(--ink);opacity:var(--shade,0);pointer-events:none;transition:opacity .6s;z-index:3}

.photo{position:relative;flex:1 1 auto;min-height:0;border-radius:calc(var(--u)*6px);overflow:hidden;
  background:radial-gradient(90% 70% at 28% 18%,#FFFFFF 0%,#F7F3EA 52%,#ECE6D9 100%)}
.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(180deg,rgba(37,35,31,.045),rgba(37,35,31,.085));border-top:1px solid rgba(37,35,31,.06)}
.photo svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.num{position:absolute;top:calc(var(--u)*8px);left:calc(var(--u)*9px);z-index:2;font-size:calc(var(--u)*9px);letter-spacing:.14em;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.capn{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:6px;padding:calc(var(--u)*10px) calc(var(--u)*2px) calc(var(--u)*2px)}
.house{font-size:calc(var(--u)*8.5px);letter-spacing:.17em;text-transform:uppercase;color:var(--olive-deep);font-weight:600;white-space:nowrap}
.nm{font-family:var(--serif);font-size:calc(var(--u)*21px);line-height:1.1;font-weight:500;margin-top:calc(var(--u)*3px);letter-spacing:-.005em;white-space:nowrap}
.spec{font-size:calc(var(--u)*10px);color:var(--soft);margin-top:calc(var(--u)*3px);letter-spacing:.02em;white-space:nowrap}
.low{text-align:right;font-size:calc(var(--u)*9.5px);color:var(--clay-deep);font-weight:600;letter-spacing:.02em;padding-bottom:calc(var(--u)*2px);white-space:nowrap}
.low i{display:block;margin:calc(var(--u)*4px) 0 0 auto;width:calc(var(--u)*34px);height:2px;border-radius:1px;background:rgba(164,98,63,.25);overflow:hidden}
.low b{display:block;height:100%;background:var(--clay)}
.tab{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);background:var(--olive-deep);color:var(--paper);font-size:calc(var(--u)*8.5px);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  padding:calc(var(--u)*5px) calc(var(--u)*10px);border-radius:2px;opacity:0;transition:opacity .5s .3s;white-space:nowrap;box-shadow:0 2px 6px -2px rgba(37,35,31,.4);pointer-events:none}
.slot.is-pick .tab{opacity:1}

/* ownership record (back of card) */
.back{padding:calc(var(--u)*16px)}
.rec-h{display:flex;justify-content:space-between;font-size:calc(var(--u)*8.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--olive-deep);font-weight:600;padding-bottom:calc(var(--u)*8px);border-bottom:1px solid var(--hair)}
.rec-t{font-family:var(--serif);font-size:calc(var(--u)*24px);font-weight:500;margin-top:calc(var(--u)*12px);line-height:1.05}
.rec-s{font-size:calc(var(--u)*10px);color:var(--soft);margin-top:calc(var(--u)*3px);letter-spacing:.04em}
.back dl{margin-top:calc(var(--u)*12px);display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*5px) calc(var(--u)*10px);font-size:calc(var(--u)*10.5px)}
.back dt{color:var(--soft);letter-spacing:.04em}
.back dd{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.rec-n{margin-top:auto;font-family:var(--serif);font-style:italic;font-size:calc(var(--u)*13px);line-height:1.35;border-top:1px solid var(--hair);padding-top:calc(var(--u)*10px)}

/* ---------- info + actions ---------- */
.info{flex:none;padding:14px 24px 0;text-align:center;min-height:128px;transition:opacity .14s}
.info.swap{opacity:0}
.reason{font-size:12px;color:var(--olive-deep);font-weight:600;letter-spacing:.02em;height:17px;margin-bottom:5px}
.notes{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.25}
.meta{font-size:11.5px;color:var(--soft);margin-top:6px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.meta .lw{color:var(--clay-deep);font-weight:600}
.actions{display:flex;gap:10px;justify-content:center;margin-top:13px}
.btn{height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--ink);color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.01em;display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease),background .3s,color .3s,opacity .3s}
.btn.primary{background:var(--ink);color:var(--oat)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.done,.btn.done[disabled]{background:transparent;border-color:var(--olive);color:var(--olive-deep);opacity:1}

/* ---------- toolbar ---------- */
.toolbar{flex:none;display:flex;gap:10px;justify-content:center;padding:10px 16px 28px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);flex:0 1 224px;min-width:0;width:224px;height:46px;border-radius:23px;padding:4px}
.seg button{position:relative;z-index:1;font-size:11.5px;font-weight:600;color:var(--soft);transition:color .3s;letter-spacing:.01em}
.seg button[aria-pressed="true"]{color:var(--ink)}
.thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:19px;background:rgba(255,255,255,.82);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 4px 10px -4px rgba(37,35,31,.3);transition:transform .55s var(--ease)}
.seg[data-i="1"] .thumb{transform:translateX(100%)}
.seg[data-i="2"] .thumb{transform:translateX(200%)}
.pickbtn{white-space:nowrap;flex:none;height:46px;padding:0 18px 0 15px;border-radius:23px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;transition:transform .25s var(--ease)}
.pickbtn svg{color:var(--olive-deep)}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,10px);z-index:70;background:var(--paper);border:1px solid var(--hair);padding:9px 16px;border-radius:18px;font-size:12.5px;font-weight:600;
  box-shadow:0 12px 26px -14px rgba(37,35,31,.5);opacity:0;transition:opacity .35s,transform .5s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- dynamic island (testing session only) ---------- */
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;transform:translateX(-50%);background:#000;border-radius:22px;z-index:100;color:#fff;overflow:hidden;cursor:pointer;
  transition:width .6s var(--ease),height .6s var(--ease),border-radius .6s var(--ease),opacity .3s;font-variant-numeric:tabular-nums}
.island::after{content:"";position:absolute;right:14px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b2d33,#0b0c0f);transition:opacity .2s}
.island:not([data-s="idle"])::after{opacity:0}
.island[data-s="compact"]{width:196px}
.island[data-s="expanded"],.island[data-s="done"]{width:358px;height:134px;border-radius:40px}
.i-c,.i-x{position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none}
.island[data-s="compact"] .i-c{opacity:1;transition-delay:.15s}
.island[data-s="expanded"] .i-x,.island[data-s="done"] .i-x{opacity:1;transition-delay:.2s;pointer-events:auto}
.i-c{display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 12px}
.ring{width:22px;height:22px;flex:none}
.ring.big{width:36px;height:36px}
.ring circle{fill:none;stroke-width:2.4}
.ring .bg{stroke:#2f302a}
.ring .fg{stroke:#B9BD9C;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .25s linear}
.i-time{font-size:14px;font-weight:600;letter-spacing:.01em;color:#EDE9DD}
.i-x{padding:16px 22px 0}
.i-row{display:flex;align-items:center;gap:12px}
.i-lab{flex:1;min-width:0}
.i-lab small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#A4A596;font-weight:600}
.i-lab strong{display:block;font-family:var(--serif);font-weight:500;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-big{font-size:32px;font-weight:300;letter-spacing:-.01em}
.i-prompt{margin-top:10px;font-size:13px;color:#D4D4C9;line-height:1.3;min-height:17px}
.i-btns{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.ibtn{height:32px;padding:0 16px;border-radius:16px;font-size:12.5px;font-weight:600;background:#26272a;color:#EDE9DD}
.ibtn.go{background:#B9BD9C;color:#1d1e18}

/* ---------- cabinet doors (first open) ---------- */
.dim{position:absolute;inset:0;z-index:85;background:rgba(24,22,18,.64);pointer-events:none;transition:opacity 1.5s ease .35s}
.dim.off{opacity:0}
.cabinet{position:absolute;inset:0;z-index:90;perspective:1300px;perspective-origin:50% 45%;cursor:pointer}
.cabinet.gone{display:none}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(180deg,#DAD1BF,#CDC3AE);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:transform 1.7s cubic-bezier(.6,0,.2,1);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.door.l{left:0;transform-origin:0 50%;border-right:1px solid rgba(37,35,31,.28)}
.door.r{right:0;transform-origin:100% 50%;border-left:1px solid rgba(37,35,31,.28)}
.door::before{content:"";position:absolute;inset:26px 20px 26px 24px;border:1px solid rgba(37,35,31,.14);box-shadow:inset 0 2px 8px rgba(37,35,31,.08),0 1px 0 rgba(255,255,255,.5)}
.door.r::before{inset:26px 24px 26px 20px}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(37,35,31,0),rgba(37,35,31,.28));opacity:0;transition:opacity 1.7s}
.door.r::after{background:linear-gradient(270deg,rgba(37,35,31,0),rgba(37,35,31,.28))}
.cabinet.open .door::after{opacity:1}
.cabinet.open .door.l{transform:rotateY(-108deg)}
.cabinet.open .door.r{transform:rotateY(108deg)}
.pull{position:absolute;top:46%;width:5px;height:78px;border-radius:3px;background:linear-gradient(90deg,#4d503f,#8a8d74,#4d503f);box-shadow:0 3px 6px -2px rgba(37,35,31,.5)}
.door.l .pull{right:17px}
.door.r .pull{left:17px}
.label{position:absolute;right:28px;top:33%;width:132px;padding:12px 8px;text-align:center;background:var(--paper);border:1px solid rgba(37,35,31,.4);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 10px -6px rgba(37,35,31,.4)}
.label b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.16em;text-transform:uppercase;padding-left:.16em}
.label span{display:block;margin-top:5px;font-size:8px;letter-spacing:.14em;white-space:nowrap;text-transform:uppercase;color:var(--olive-deep);font-weight:600}
.hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--olive-deep);font-weight:600;opacity:0;animation:hint 1.2s ease .5s forwards;transition:opacity .4s;pointer-events:none}
.cabinet.open .hint{animation:none;opacity:0}
@keyframes hint{to{opacity:1}}

/* ---------- share sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(37,35,31,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:65;background:var(--oat);border-radius:28px 28px 0 0;padding:10px 18px 26px;transform:translateY(105%);transition:transform .7s var(--ease);box-shadow:0 -20px 50px -20px rgba(37,35,31,.4);display:flex;flex-direction:column;align-items:center}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(37,35,31,.2);margin-bottom:10px}
.sheet-t{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--olive-deep);margin-bottom:10px}
.ed-wrap{width:300px;height:380px;position:relative}
.ed{position:absolute;left:0;top:0;width:300px;height:380px;transform-origin:top center;padding:22px;display:flex;flex-direction:column;
  background:linear-gradient(100deg,#FCF8F0 0%,#F4EFE4 55%,#EDE7DA 100%);box-shadow:0 0 0 1px rgba(37,35,31,.08),0 24px 40px -24px rgba(37,35,31,.5)}
.ed-top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--olive-deep)}
.ed-title{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.012em;line-height:1;margin:10px 0 12px}

   - waves: two travelling ripples. Their energy comes from motion and fades. They run the way the card is moving.

/* ---------- geometry ---------- */
function geo(){

  var cw=sw*.62, ch=Math.min(shh-plank-26,cw/.60,410);

/* ---------- layouts: one DOM, three arrangements, same transform grammar ---------- */
function place(i,pos){
  var W=G.cw,H=G.ch,v=VPOS[i],d=v-pos,ad=Math.abs(d),s=d<0?-1:1;
  var o={x:0,y:0,z:0,ry:0,p:0,rz:0,s:1,op:1,shade:0,zi:10};
  if(!introDone||v<0){o.y=H*.16;o.z=-60;o.s=.96;o.op=0;o.shade=.2;o.zi=v<0?5:10-Math.round(ad);return o}
  if(mode==='flow'){
    var near=Math.min(ad,1),far=Math.max(ad-1,0);
    o.x=s*(near*W*.62+far*W*.20);o.z=-(near*W*.85+far*W*.25);o.ry=-s*near*54;
    o.y=-(1-near)*H*.012;o.s=1+(1-near)*.03;
    o.shade=near*.10+Math.min(far,1.5)*.06;o.zi=100-Math.round(ad*10);o.op=ad>3.6?0:1;
  }else{ /* stack */
    if(d>=0){
      var dd=Math.min(d,3);
      o.y=-dd*H*.05;o.z=-d*30;o.s=1-dd*.05;o.rz=LEAN[v%LEAN.length]*Math.min(d,1);
      o.shade=dd*.05;o.zi=100-Math.round(d*10);o.op=d>3.4?0:1;
    }else{
      var t=Math.min(-d,1);
      o.x=-t*W*1.15;o.y=t*H*.03;o.rz=-t*12;o.s=1-t*.04;o.op=1-t;o.zi=130;
    }
  }
  if(i===pickIdx&&i===sel&&mode!=='fan'){o.y-=H*.025;o.z+=24;o.s*=1.02}
  return o;
}
function fanSet(){var r=ROTI();return r.indexOf(sel)>-1?r:[sel,r[0],r[1]]}
function rightOf(){var set=fanSet();return set[(set.indexOf(sel)+1)%3]}
function leftOf(){var set=fanSet();return set[(set.indexOf(sel)+2)%3]}
function fanPlace(i){
  var W=G.cw,H=G.ch,set=fanSet(),k=set.indexOf(i);
  if(k<0)return {x:0,y:H*.16,z:-90,ry:0,p:0,rz:0,s:.9,op:0,shade:.2,zi:5};
  var sp=i===sel?0:(i===rightOf()?1:-1);
  return {x:sp*W*.03,y:Math.abs(sp)*H*.03-(sp===0?H*.02:0),z:sp===0?40:0,ry:0,p:H*.85,rz:sp*14,s:sp===0?1:.9,op:1,shade:sp===0?0:.07,zi:sp===0?120:(sp===1?110:100)};
}
function render(pos){
  if(pos==null)pos=VPOS[sel];

    var o=(mode==='fan'&&introDone)?fanPlace(i):place(i,pos);
    el.style.transform='translate3d('+o.x.toFixed(1)+'px,'+o.y.toFixed(1)+'px,'+o.z.toFixed(1)+'px) rotateY('+o.ry.toFixed(1)+'deg) translateY('+o.p.toFixed(1)+'px) rotateZ('+o.rz.toFixed(2)+'deg) translateY('+(-o.p).toFixed(1)+'px) scale('+o.s.toFixed(3)+')';
    el.style.opacity=o.op;el.style.zIndex=o.zi;el.style.setProperty('--shade',o.shade);

}

/* Real export: the editorial shelf is drawn to a 1080x1350 canvas, then handed to the iOS share
   sheet (Save Image, Messages, AirDrop) or downloaded where sharing files is unavailable. */
function svgImg(svg,w,h){return new Promise(function(res,rej){
  var s=svg.replace('<svg ','<svg width="'+w+'" height="'+h+'" ');var im=new Image();
  im.onload=function(){res(im)};im.onerror=function(){rej(new Error('svg'))};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
})}
function spaced(ctx,t,x,y,sp,align){
  var ws=[],w=0,i;
  for(i=0;i<t.length;i++){var cw=ctx.measureText(t.charAt(i)).width;ws.push(cw);w+=cw+(i<t.length-1?sp:0)}
  var sx=align==='right'?x-w:(align==='center'?x-w/2:x);
  ctx.textAlign='left';
  for(i=0;i<t.length;i++){ctx.fillText(t.charAt(i),sx,y);sx+=ws[i]+sp}
}
function renderShelfPNG(){
  var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  var ctx=c.getContext('2d');
  var SANS='-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Helvetica,Arial,sans-serif';
  var SERIF='ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif';
  var tiers=tiersOf(),baseY=tiers.length===1?[980]:[790,1170],jobs=[];
  tiers.forEach(function(t){t.forEach(function(i){jobs.push(svgImg(BOTTLES[i].draw('x'+i,BOTTLES[i].left),150,330))})});
  return Promise.all(jobs).then(function(imgs){
    var g=ctx.createLinearGradient(0,0,W,H*.35);
    g.addColorStop(0,'#FCF8F0');g.addColorStop(.55,'#F4EFE4');g.addColorStop(1,'#EDE7DA');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#575A44';ctx.font='600 24px '+SANS;
    spaced(ctx,'AROOMA',88,100,5,'left');spaced(ctx,String(new Date().getFullYear()),W-88,100,5,'right');
    ctx.fillStyle='#25231F';ctx.textAlign='left';
    var ttl=shelfName(curShelf),fs=150;ctx.font='500 '+fs+'px '+SERIF;
    while(fs>60&&ctx.measureText(ttl).width>W-168){fs-=6;ctx.font='500 '+fs+'px '+SERIF}
    ctx.fillText(ttl,84,300);
    var idx=0;
    tiers.forEach(function(t,ti){
      var y=baseY[ti];
      ctx.fillStyle='rgba(37,35,31,.35)';ctx.fillRect(88,y,W-176,2);
      var sg=ctx.createLinearGradient(0,y+2,0,y+16);
      sg.addColorStop(0,'rgba(37,35,31,.12)');sg.addColorStop(1,'rgba(37,35,31,0)');
      ctx.fillStyle=sg;ctx.fillRect(88,y+2,W-176,14);
      t.forEach(function(i,k){
        var cx=88+(W-176)*(k+.5)/t.length;
        ctx.drawImage(imgs[idx++],cx-75,y-330+10,150,330);
        ctx.fillStyle='#6B6862';ctx.font='600 20px '+SANS;spaced(ctx,pad(VPOS[i]+1),cx,y+52,3,'center');
      });
    });
    ctx.fillStyle='#6B6862';ctx.font='600 20px '+SANS;
    spaced(ctx,footTxt().toUpperCase(),88,1298,3,'left');spaced(ctx,'N° '+pad(VIEW.length),W-88,1298,3,'right');
    return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('toBlob'))},'image/png')});
  });
}
var shelfBlob=null,shelfPromise=null,shelfRev=0;
function prepShelf(){
  if(shelfBlob||shelfPromise)return;
  var rev=shelfRev;
  shelfPromise=renderShelfPNG().then(function(b){if(rev===shelfRev)shelfBlob=b;shelfPromise=null}).catch(function(){shelfPromise=null});
}
function shelfFile(){return 'arooma-'+(shelfName(curShelf).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'shelf')+'.png'}
function deliverShelf(blob){
  var file=null;try{file=new File([blob],shelfFile(),{type:'image/png'})}catch(e){}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:shelfName(curShelf)}).then(function(){haptic('complete')},function(err){if(!err||err.name!=='AbortError')toast('Could not open the share sheet')});
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=shelfFile();document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},4000);haptic('complete');toast('Image saved');
  return Promise.resolve();
}

var MAXN=40;
function addBottle(spec){
  if(N>=MAXN){toast('The cabinet holds '+MAXN+' bottles.');return}
  var b=clean(spec);if(!b)return;prep(b);if(!shelfById(b.shelf))b.shelf=curShelf;

/* ---- delete, with undo ---- */
function confirmDelete(i){
  var b=BOTTLES[i],n=b.log.length;
  openPanel('<h2>Delete '+esc(b.name)+'?</h2><p class="sub">Its '+n+(n===1?' wear':' wears')+', its note and its evidence go with it. You can undo for a few seconds.</p>'
   +'<div class="pbtns"><button class="btn" data-act="cancel">Keep it</button><button class="btn primary" data-act="yes">Delete</button></div>',
  function(e){var a=actOf(e);if(a==='cancel')closePanel();else if(a==='yes'){closePanel();deleteBottle(i)}});
}
function deleteBottle(i){
  var b=BOTTLES[i];if(!b||N<=1)return;
  var pid=pickIdx!=null&&BOTTLES[pickIdx]?BOTTLES[pickIdx].id:null,wasSel=(i===sel);
  BOTTLES.splice(i,1);var el=slots.splice(i,1)[0];LQ.dropSlot(el);el.parentNode.removeChild(el);N=BOTTLES.length;
  pickIdx=pid&&pid!==b.id?idxOfId(pid):null;markPick();
  if(sel>i)sel--;
  else if(wasSel){
    /* stay on the same shelf when it still has bottles: the one that slid into this place, else the last one before it */
    var k=-1,j;for(j=i;j<N;j++)if(BOTTLES[j].shelf===b.shelf){k=j;break}
    if(k<0)for(j=Math.min(i,N)-1;j>=0;j--)if(BOTTLES[j].shelf===b.shelf){k=j;break}
    sel=k>=0?k:Math.min(i,N-1);
  }
  if(sel>=N)sel=N-1;
  slots.forEach(function(s){s.classList.remove('flipped')});
  renumber();shelfChanged();saveState();render();updateInfo();haptic('complete');
  toast('Deleted '+b.name+'.',{label:'Undo',fn:function(){restoreBottle(b,i)}});
}
function restoreBottle(b,i){
  var pid=pickIdx!=null&&BOTTLES[pickIdx]?BOTTLES[pickIdx].id:null;
  if(!shelfById(b.shelf))b.shelf=SHELVES[0].id;
  i=Math.min(i,BOTTLES.length);BOTTLES.splice(i,0,b);N=BOTTLES.length;
  var el=buildSlot(b,i);slots.splice(i,0,el);stage.appendChild(el);
  pickIdx=pid?idxOfId(pid):null;markPick();
  renumber();sel=i;shelfChanged();saveState();render();updateInfo();haptic('complete');
}

      if(!addWear(b,v)){err.textContent='That date is already logged.';return}
      saveState();refreshBottle(b);panelBody.innerHTML=body();toast('Logged a wear on '+fmtShort(v)+'.');
    }else if(a==='cancel')closePanel();
  });

/* ---- authenticity: an evidence checklist. It never says "authentic". ---- */
var AUTH_ITEMS=['The batch code on the box matches the one on the bottle','The label print is sharp and evenly spaced','The cap sits straight and the seal is clean','The liquid is the color the house normally uses','You bought it from the house or an authorized seller'];
function authSummary(v){
  var checked=0,good=0,bad=0;v.forEach(function(x){if(x){checked++;if(x===1)good++;else bad++}});
  var det=function(n){return n===1?'detail':'details'};
  if(!checked)return {t:'Nothing checked yet',p:'Go through the five details with the bottle and the box in front of you.'};
  if(bad)return {t:'Differs on '+bad+' of '+checked+' checked '+det(checked),p:'This does not prove the bottle is fake and it is not a verdict. Compare it with the house\u2019s own guide, or ask the seller.'};
  if(checked<5)return {t:'Consistent on '+good+' of '+checked+' checked '+det(checked),p:'Check the remaining '+(5-checked)+' to finish.'};
  return {t:'Consistent on all 5 details',p:'This does not verify authenticity. Only the house or an authorized seller can.'};
}
function openAuth(){
  var b=BOTTLES[sel],v=b.auth?b.auth.v.slice():[0,0,0,0,0];
  function sumHtml(){var s=authSummary(v);return '<b>'+s.t+'</b><p>'+s.p+'</p>'}
  var rows=AUTH_ITEMS.map(function(t,k){return '<div class="obs">'+t+'<div class="seg3" data-k="'+k+'">'
    +'<button data-val="1" aria-pressed="'+(v[k]===1)+'">Matches</button><button data-val="2" aria-pressed="'+(v[k]===2)+'">Differs</button><button data-val="0" aria-pressed="'+(v[k]===0)+'">Not checked</button></div></div>'}).join('');
  openPanel('<h2>Authenticity evidence</h2><p class="sub">'+esc(b.name)+' by '+esc(b.house)+'. Simulated in this demo: no scan and no database lookup. Arooma cannot verify authenticity.</p>'
    +rows+'<div class="result" id="aRes" aria-live="polite">'+sumHtml()+'</div>'
    +'<div class="pbtns"><button class="btn" data-act="clear">Clear</button><button class="btn primary" data-act="saveA">Save to record</button></div>',
  function(e){
    var btn=e.target.closest?e.target.closest('.seg3 button'):null;
    if(btn){
      var k=+btn.parentNode.getAttribute('data-k');v[k]=+btn.getAttribute('data-val');
      $$('button',btn.parentNode).forEach(function(x){x.setAttribute('aria-pressed',x===btn)});$('#aRes').innerHTML=sumHtml();return;
    }
    var a=actOf(e);
    if(a==='clear'){v=[0,0,0,0,0];$$('.seg3 button').forEach(function(x){x.setAttribute('aria-pressed',x.getAttribute('data-val')==='0')});$('#aRes').innerHTML=sumHtml()}
    else if(a==='saveA'){
      b.auth=v.some(function(x){return x})?{v:v.slice(),at:todayStr()}:null;
      saveState();refreshBottle(b);closePanel();haptic('complete');toast('Evidence saved to the record.');
    }
  });
}

/* ---- blind-buy compare: overlap in listed notes, never a promise ---- */
var EXAMPLES=['bergamot, vetiver, smoked tea','fig leaf, cedar, vanilla','rose, musk, amber','sea salt, cedar, grapefruit'];
function listOf(a){return a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}
function compareText(cand,own,name){
  var shared=[],more=[],less=[];
  AXES.forEach(function(ax,i){var a=ax.toLowerCase();if(cand[i]>=.4&&own[i]>=.4)shared.push(a);else if(cand[i]-own[i]>=.4)more.push(a);else if(own[i]-cand[i]>=.4)less.push(a)});
  var out=[shared.length?'Both lean '+listOf(shared)+'.':'They share no strong note family.'];
  if(more.length)out.push('The new one leans more toward '+listOf(more)+'.');
  if(less.length)out.push(esc(name)+' leans more toward '+listOf(less)+'.');
  return out.join(' ');
}
function radar(own,cand){
  var cx=130,cy=118,R=76;
  function pt(i,r){var a=(-90+i*45)*Math.PI/180;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]}
  function poly(v,floor){return v.map(function(x,i){var p=pt(i,Math.max(floor,x));return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')}
  var rings=[.5,1].map(function(r){return '<polygon points="'+poly(AXES.map(function(){return r}),0)+'" style="fill:none;stroke:var(--hair)"/>'}).join('');
  var axes=AXES.map(function(n,i){
    var e=pt(i,1),l=pt(i,1.22),c=Math.cos((-90+i*45)*Math.PI/180),anchor=Math.abs(c)<.2?'middle':(c>0?'start':'end');
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" style="stroke:var(--hair)"/><text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+anchor+'" font-size="11" style="fill:var(--soft)">'+n+'</text>';
  }).join('');
  return '<svg class="radar" viewBox="0 0 260 236" role="img" aria-label="Scent profile comparison">'+rings+axes
   +'<polygon points="'+poly(own,.04)+'" style="fill:rgba(37,35,31,.10);stroke:var(--ink);stroke-width:1.6"/>'
   +'<polygon points="'+poly(cand,.04)+'" style="fill:rgba(115,118,95,.22);stroke:var(--olive);stroke-width:1.6"/></svg>';
}
function openCompare(){
  var text='',pick=-1;
  function results(){
    if(!text.trim())return '<p class="sub">Type the notes from the box or the website, then see which bottle in your cabinet it overlaps with most.</p>';
    var p=profileOf(text);
    if(!p.hits.length)return '<div class="result"><b>No notes recognized</b><p>Try note names such as cedar, fig leaf, amber, musk or bergamot.</p></div>';
    var ranked=BOTTLES.map(function(b,i){return {i:i,o:overlap(p.v,b.dna)}}).sort(function(a,b){return b.o-a.o}).slice(0,3);
    var cur=ranked.filter(function(r){return r.i===pick})[0]||ranked[0],b=BOTTLES[cur.i];
    var list=ranked.map(function(r){var x=BOTTLES[r.i];return '<button class="prow" data-i="'+r.i+'" aria-pressed="'+(r===cur)+'"><span><b>'+esc(x.name)+'<span class="pct">'+Math.round(r.o*100)+'%</span></b><small>'+esc(x.house)+'</small></span></button>'}).join('');
    return '<p class="sub">Recognized: '+esc(p.hits.join(', '))+'.</p><div class="cmp"><div class="fl" style="margin-top:6px">Overlap in listed notes</div>'+list+'</div>'
      +radar(b.dna,p.v)+'<div class="legend"><span><i style="background:var(--ink)"></i>'+esc(b.name)+'</span><span><i style="background:var(--olive)"></i>The new bottle</span></div>'
      +'<div class="result"><b>'+Math.round(cur.o*100)+'% overlap with '+esc(b.name)+'</b><p>'+compareText(p.v,b.dna,b.name)+'</p>'
      +'<p>Based on listed notes only. Skin, concentration and batch change how a scent wears. This does not predict whether you will like it.</p></div>';
  }
  openPanel('<h2>Compare before you buy</h2><p class="sub">Notes only. It cannot tell you how a scent will wear on you.</p>'
   +'<label class="fl" for="cNotes">Notes of the bottle you are considering</label><input class="in" id="cNotes" autocomplete="off" maxlength="120" placeholder="cedar, fig leaf, warm milk">'
   +'<div class="chips">'+EXAMPLES.map(function(x,k){return '<button class="chip" data-ex="'+k+'">'+esc(x)+'</button>'}).join('')+'</div>'
   +'<div id="cRes">'+results()+'</div><div class="pbtns"><button class="btn" data-act="cancel">Done</button></div>',
  function(e){
    var ex=e.target.closest?e.target.closest('[data-ex]'):null;
    if(ex){text=EXAMPLES[+ex.getAttribute('data-ex')];$('#cNotes').value=text;pick=-1;$('#cRes').innerHTML=results();return}
    var r=e.target.closest?e.target.closest('[data-i]'):null;
    if(r){pick=+r.getAttribute('data-i');$('#cRes').innerHTML=results();return}
    if(actOf(e)==='cancel')closePanel();
  },
  function(e){if(e.target.id==='cNotes'){text=e.target.value;pick=-1;$('#cRes').innerHTML=results()}});
}

var dev=$('#device'),over=$('#over'),overScroll=$('#overScroll'),ovBar=$('#ovBar'),toolbarMain=$('#toolbar'),infoEl=$('#info');
var Z=0,zRaf=0,ovBuilt=false,zs=null,pz=null,pts={},wheelT=0,noClickUntil=0;
function unflip(el){el.classList.remove('flipped')}
function setZ(v){
  Z=clamp(v,0,1);dev.style.setProperty('--z',Z.toFixed(3));
  var on=Z>.97;
  stage.classList.toggle('off',on);infoEl.classList.toggle('off',on);toolbarMain.classList.toggle('off',on);
  over.classList.toggle('off',Z<.03);ovBar.classList.toggle('off',Z<.03);
  over.setAttribute('aria-hidden',Z<.5?'true':'false');
  $('#shelvesBtn').setAttribute('aria-pressed',Z>.5?'true':'false');
  LQ.setVis(Z<.97,Z>.03);setTitle();
}
function cancelZ(){if(zRaf){cancelAnimationFrame(zRaf);zRaf=0}}
function tweenZ(to,ms){
  cancelZ();
  if(RM||Math.abs(to-Z)<.001){setZ(to);zDone(to);return}
  var from=Z,t0=performance.now();
  (function step(t){
    var u=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-u,3);setZ(from+(to-from)*e);
    if(u<1)zRaf=requestAnimationFrame(step);else{zRaf=0;zDone(to)}
  })(t0);
}
function zDone(to){
  if(to===1)LQ.kickGroup('ov',{s:.12,A:1.1,b:.5,rand:1});
  else LQ.kick(slots[sel],{s:.1,A:.9,b:.4});
}
function fitOver(){
  var sc=$('#screen');
  over.style.setProperty('--ot',stage.offsetTop+'px');
  over.style.setProperty('--ob',Math.max(0,sc.clientHeight-(infoEl.offsetTop+infoEl.offsetHeight))+'px');
}
function pickInShelf(id){
  var k=shelfLast[id]?idxOfId(shelfLast[id]):-1;
  if(k>-1&&BOTTLES[k].shelf===id)return k;
  for(var i=0;i<BOTTLES.length;i++)if(BOTTLES[i].shelf===id)return i;
  return -1;
}
function goTo(i){if(i===sel||!BOTTLES[i])return;slots.forEach(unflip);sel=i;syncShelf();render();updateInfo()}
function shelfAtPoint(x,y){var el=document.elementFromPoint(x,y),h=el&&el.closest?el.closest('.shelf'):null;return h?h.getAttribute('data-id'):curShelf}
function canZoom(){return introDone&&!panel.classList.contains('on')&&!$('#sheet').classList.contains('on')}

/* the overview: every shelf as a row of miniature bottles. Bottles keep their true liquid level. */
var PENCIL='<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 3.8l3 3L7.4 15.6l-3.9.9.9-3.9z"/><path d="M11.6 5.4l3 3"/></svg>';
function buildOver(){
  ovBuilt=true;LQ.dropGroup('ov');
  var per=Math.max(4,Math.floor(((overScroll.clientWidth||366)-56+6)/46)),h='';
  SHELVES.forEach(function(sh){
    var idxs=[];BOTTLES.forEach(function(b,i){if(b.shelf===sh.id)idxs.push(i)});
    var cur=sh.id===curShelf;
    h+='<section class="shelf'+(cur?' cur':'')+'" data-id="'+sh.id+'" aria-label="'+esc(sh.name)+'"'+(cur?' aria-current="true"':'')+'>'
      +'<div class="sh-top"><button class="sname" data-open="'+sh.id+'">'+esc(sh.name)+'</button>'
      +'<span class="scount">'+pad(idxs.length)+(idxs.length===1?' object':' objects')+(cur?' &middot; here':'')+'</span>'
      +'<button class="pen" data-pen="'+sh.id+'" aria-label="Rename '+esc(sh.name)+'">'+PENCIL+'</button></div>';
    if(!idxs.length)h+='<div class="sh-empty"><span>Nothing here yet</span><button class="sh-add" data-addto="'+sh.id+'">Add a bottle</button></div><div class="pl"></div>';
    else for(var k=0;k<idxs.length;k+=per){
      h+='<div class="tier">'+idxs.slice(k,k+per).map(function(i){
        var b=BOTTLES[i];
        return '<button class="mb'+(i===sel?' is-sel':'')+'" data-b="'+i+'" aria-label="'+esc(b.house+', '+b.name)+(i===sel?', selected':'')+'">'+b.draw('o'+b.id,b.left)+'</button>';
      }).join('')+'</div><div class="pl"></div>';
    }
    h+='</section>';
  });
  overScroll.innerHTML=h;
  $$('.lq',overScroll).forEach(function(p){LQ.regStatic(p,'ov')});
}
overScroll.addEventListener('click',function(e){
  if(performance.now()<noClickUntil)return;
  var t=e.target.closest?e.target.closest('button'):null;if(!t)return;
  if(t.getAttribute('data-b')!==null)zoomToBottle(+t.getAttribute('data-b'));
  else if(t.getAttribute('data-open'))zoomInto(t.getAttribute('data-open'));
  else if(t.getAttribute('data-pen'))openRename(t.getAttribute('data-pen'));
  else if(t.getAttribute('data-addto'))openAdd(t.getAttribute('data-addto'));
});
function openOver(){
  if(!introDone||Z>.5||panel.classList.contains('on'))return;
  closeSheet();slots.forEach(unflip);buildOver();fitOver();
  var cur=$('.shelf.cur',overScroll);if(cur)overScroll.scrollTop=Math.max(0,cur.offsetTop-8);
  tweenZ(1,640);
}
function closeOver(){tweenZ(0,560)}
function toggleOver(){if(Z>.5)closeOver();else openOver()}
function zoomToBottle(i){goTo(i);tweenZ(0,560)}
function zoomInto(id){var k=pickInShelf(id);if(k<0){openAdd(id);return}zoomToBottle(k)}
$('#shelvesBtn').addEventListener('click',toggleOver);
$('#addShelf').addEventListener('click',function(){openNewShelf()});
$('#openShelf').addEventListener('click',function(){zoomInto(curShelf)});

/* gestures. zs is the zoom in progress, pz the pinch driving it. */
function zoomStart(mx,my){
  cancelZ();
  zs={from:Z>.5?1:0,z0:Z,target:null,blocked:false,prevSel:sel};
  if(zs.from===0){slots.forEach(unflip);buildOver();fitOver()}
  else{
    var id=shelfAtPoint(mx,my),k=pickInShelf(id);zs.target=id;
    if(k<0)zs.blocked=true;else goTo(k);
  }
}
function pinchTo(scale){if(zs)setZ(zs.z0+(1-scale)/.5)}
function zoomFinish(){
  var z=zs;zs=null;
  var to=z&&z.from===1?(Z<.7?0:1):(Z>.3?1:0);
  if(z&&z.blocked&&to===0){to=1;toast('That shelf is empty. Tap Add a bottle on it.')}
  if(z&&z.from===1&&to===1&&z.prevSel!==sel)goTo(z.prevSel);
  tweenZ(to,380);
}
function pinchBegin(){
  var k=Object.keys(pts),a=pts[k[0]],b=pts[k[1]];
  if(drag){try{stage.releasePointerCapture(drag.id)}catch(_){}drag=null;stage.classList.remove('dragging');render()}
  zoomStart((a.x+b.x)/2,(a.y+b.y)/2);
  pz={d0:Math.max(40,Math.hypot(a.x-b.x,a.y-b.y)),src:'p'};
}
function endPinch(){if(!pz)return;pz=null;noClickUntil=performance.now()+400;zoomFinish()}
dev.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse')return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(pts).length===2&&!zs&&canZoom())pinchBegin();
},true);
dev.addEventListener('pointermove',function(e){
  var p=pts[e.pointerId];if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(!pz||pz.src!=='p')return;
  var k=Object.keys(pts);if(k.length<2)return;
  pinchTo(Math.hypot(pts[k[0]].x-pts[k[1]].x,pts[k[0]].y-pts[k[1]].y)/pz.d0);
},true);
function ptrEnd(e){
  delete pts[e.pointerId];
  if(pz&&pz.src==='p'&&Object.keys(pts).length<2)endPinch();
  else if(pz&&pz.src==='g')setTimeout(function(){if(pz&&pz.src==='g'&&!Object.keys(pts).length)endPinch()},160);
}
dev.addEventListener('pointerup',ptrEnd,true);
dev.addEventListener('pointercancel',ptrEnd,true);
/* iOS Safari and macOS Safari report a pinch as WebKit gesture events. Blocking them also stops the page itself zooming. */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
dev.addEventListener('gesturestart',function(e){
  if(!canZoom())return;
  if(!zs)zoomStart(e.clientX||window.innerWidth/2,e.clientY||window.innerHeight/2);
  pz={d0:1,src:'g'};
});
dev.addEventListener('gesturechange',function(e){if(pz&&pz.src==='g')pinchTo(e.scale)});
dev.addEventListener('gestureend',function(){if(pz&&pz.src==='g')endPinch()});
/* a trackpad pinch arrives as ctrl+wheel; deltaY above zero means the fingers are closing */
dev.addEventListener('wheel',function(e){
  if(!e.ctrlKey)return;
  e.preventDefault();
  if(!canZoom())return;
  if(!zs)zoomStart(e.clientX,e.clientY);
  cancelZ();setZ(Z+e.deltaY*.012);
  clearTimeout(wheelT);wheelT=setTimeout(zoomFinish,150);
},{passive:false});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||''))return;
  if(e.key==='-'||e.key==='_'){if(Z<.5)openOver()}
  else if(e.key==='='||e.key==='+'){if(Z>.5)closeOver()}
});

/* ---- shelves: rename, add, remove, move a bottle ---- */
function renameShelf(id,name){var h=shelfById(id);if(!h)return;h.name=name;saveState();shareDirty();setTitle();if(ovBuilt)buildOver()}
function commitRename(id){
  var v=$('#shName').value.trim();
  if(!v){$('#shErr').textContent='Give the shelf a name.';$('#shName').focus();return}
  closePanel();renameShelf(id,v.slice(0,28));toast('Renamed to '+v.slice(0,28)+'.');
}
function openRename(id){
  var h=shelfById(id);if(!h)return;
  var n=BOTTLES.filter(function(b){return b.shelf===id}).length;
  openPanel('<h2>Rename shelf</h2><p class="sub">Shelves start with the seasons. Call this one whatever suits it.</p>'
   +'<label class="fl" for="shName">Name</label><input class="in" id="shName" maxlength="28" autocomplete="off" autocapitalize="words" value="'+esc(h.name)+'">'
   +'<p class="err" id="shErr" role="alert"></p>'
   +(n===0&&SHELVES.length>1?rowHtml('rmShelf','Remove this empty shelf','Nothing is on it. You can undo for a few seconds.','danger'):'')
   +'<div class="pbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save</button></div>',
  function(e){var a=actOf(e);if(a==='cancel')closePanel();else if(a==='save')commitRename(id);else if(a==='rmShelf'){closePanel();removeShelf(id)}});
  setTimeout(function(){var i=$('#shName');if(i){try{i.focus();i.select()}catch(e){}}},60);
}
function openNewShelf(){
  if(SHELVES.length>=MAXSH){toast('The cabinet holds '+MAXSH+' shelves.');return}
  openPanel('<h2>Add a shelf</h2><p class="sub">A shelf is a group of bottles, like a season or an occasion.</p>'
   +'<label class="fl" for="nsName">Name</label><input class="in" id="nsName" maxlength="28" autocomplete="off" autocapitalize="words" placeholder="For example, Weekend">'
   +'<p class="err" id="nsErr" role="alert"></p>'
   +'<div class="pbtns"><button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Add shelf</button></div>',
  function(e){var a=actOf(e);if(a==='cancel')closePanel();else if(a==='save'){
    var v=$('#nsName').value.trim();
    if(!v){$('#nsErr').textContent='Give the shelf a name.';$('#nsName').focus();return}
    closePanel();addShelf(v.slice(0,28));
  }});
  setTimeout(function(){var i=$('#nsName');if(i){try{i.focus()}catch(e){}}},60);
}
function addShelf(name){
  var h={id:'h'+Date.now().toString(36)+Math.floor(Math.random()*36).toString(36),name:name};
  SHELVES.push(h);saveState();buildOver();
  var el=$('.shelf[data-id="'+h.id+'"]',overScroll);if(el)overScroll.scrollTop=el.offsetTop-8;
  haptic('complete');toast('Added '+name+'. Add bottles from the plus button.');
}
function removeShelf(id){
  var i=SHELVES.findIndex(function(h){return h.id===id});
  if(i<0||SHELVES.length<2||BOTTLES.some(function(b){return b.shelf===id}))return;
  var h=SHELVES.splice(i,1)[0];saveState();buildOver();
  toast('Removed '+h.name+'.',{label:'Undo',fn:function(){SHELVES.splice(Math.min(i,SHELVES.length),0,h);saveState();buildOver()}});
}
function openMove(){
  var b=BOTTLES[sel];
  openPanel('<h2>Move '+esc(b.name)+'</h2><p class="sub">Pick the shelf it should live on.</p>'
   +SHELVES.filter(function(h){return h.id!==b.shelf}).map(function(h){
      var n=BOTTLES.filter(function(x){return x.shelf===h.id}).length;
      return '<button class="prow" data-sh="'+h.id+'"><span><b>'+esc(h.name)+'</b><small>'+(n?n+(n===1?' object':' objects'):'Empty')+'</small></span><i aria-hidden="true">&rsaquo;</i></button>';
    }).join('')
   +'<div class="pbtns"><button class="btn" data-act="cancel">Cancel</button></div>',
  function(e){
    var r=e.target.closest?e.target.closest('[data-sh]'):null;
    if(r){closePanel();moveBottle(b,r.getAttribute('data-sh'));return}
    if(actOf(e)==='cancel')closePanel();
  });
}
function moveBottle(b,id){
  var from=b.shelf;b.shelf=id;
  function after(){saveState();renumber();shelfChanged();render();updateInfo()}
  after();
  toast('Moved '+b.name+' to '+shelfName(id)+'.',{label:'Undo',fn:function(){if(shelfById(from))b.shelf=from;after()}});
}
panelBody.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  var b=$('[data-act="save"]',panelBody);if(b){e.preventDefault();b.click()}
});
function maybeShowPinchHint(){
  if(lsGet('arooma-pinch')==='1'||Z>.5||panel.classList.contains('on')||SHELVES.length<2)return;
  lsSet('arooma-pinch','1');toast('Pinch to see every shelf');
}

/* ---------- layout / fit ---------- */
function fit(){
  var dev=$('#device');
  if(window.innerWidth>520){var s=Math.min(1,(window.innerHeight-40)/844,(window.innerWidth-40)/390);dev.style.setProperty('--fit',s.toFixed(3))}
  else dev.style.removeProperty('--fit');
}
window.addEventListener('resize',function(){fit()});
if(window.ResizeObserver){new ResizeObserver(function(){geo();fitOver();render()}).observe(stage)}
else window.addEventListener('resize',function(){geo();render()});

/* ---------- iOS install layer: standalone detection, Add to Home Screen hint, offline ---------- */
var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var standalone=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
if(standalone)document.documentElement.classList.add('is-standalone');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function maybeShowInstallHint(){
  var el=$('#a2hs');
  if(!isIOS||standalone||lsGet('arooma-a2hs')==='1')return;
  el.classList.add('show');
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('in')})});
}
$('#a2hsx').addEventListener('click',function(){
  lsSet('arooma-a2hs','1');var el=$('#a2hs');el.classList.remove('in');
  setTimeout(function(){el.classList.remove('show')},600);
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}

fit();geo();fitOver();setZ(0);updateCounts();setFanState();markPick();render();updateInfo();updateTestBtn();
openT=setTimeout(openCabinet,RM?0:1700);
})();
</script>
</body>
</html>
